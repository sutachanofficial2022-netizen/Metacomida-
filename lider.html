<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metacomida · Líder</title>
<style>
:root{--ink:#3b281a;--orange:#d97928;--brown:#7c451e;--line:#ead2ad;--green:#5d9949;--red:#ca554d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff9ef,#f5e5cd);min-height:100vh}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:.13}.b{position:absolute;top:-10vh;animation:f linear infinite}@keyframes f{to{transform:translateY(120vh) rotate(360deg)}}
main{position:relative;z-index:1;max-width:620px;margin:auto;padding:18px}.card{background:#fffffff2;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 30px #65431d18;margin-bottom:14px}.logo{text-align:center;font-size:50px}.title{text-align:center;font-size:32px;font-weight:1000;color:var(--brown)}.sub{text-align:center;opacity:.7}
input{width:100%;padding:13px;border:1px solid #dfc39a;border-radius:13px;font-size:17px;margin:12px 0}button{width:100%;border:0;border-radius:15px;padding:14px;font-size:17px;font-weight:900;cursor:pointer}.join{background:linear-gradient(#ed963c,#d47825);color:#fff}.teamBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px}.teamBtn{background:#fff2df;border:1px solid var(--line);color:var(--ink)}
.round{display:inline-block;background:#fff0dc;border:1px solid #edca96;color:var(--brown);border-radius:999px;padding:7px 11px;font-weight:900;font-size:12px;text-transform:uppercase}.q{font-size:26px;font-weight:1000;line-height:1.12;margin:13px 0}.opts{display:grid;gap:10px}.opt{text-align:left;background:#fff7e9;border:2px solid #ead2ad;color:var(--ink)}.opt.selected{border-color:var(--orange);background:#ffedd4}.opt.good{border-color:#6dac78;background:#e0f3e3}.opt.bad{border-color:#d77a74;background:#f8dedd}.status{text-align:center;font-weight:900;padding:10px}.timer{text-align:center;font-size:42px;font-weight:1000;color:var(--brown)}.answer{background:#f8efe1;border-left:5px solid var(--orange);padding:12px;border-radius:10px;margin-top:12px}.hidden{display:none}
</style>
</head>
<body>
<div class="rain" id="rain"></div>
<main>
<section class="card" id="joinCard"><div class="logo">🍔</div><div class="title">Metacomida</div><div class="sub">Panel del líder · responde desde tu celular</div><div id="teamPicker" class="hidden"><p><b>Elige tu equipo:</b></p><div class="teamBtns" id="teamBtns"></div></div><input id="name" placeholder="Nombre del líder" maxlength="30"><button class="join" onclick="join()">Entrar al juego</button></section>
<section class="card hidden" id="game"><div class="status" id="who"></div><div class="round" id="round"></div><div class="timer" id="timer">15</div><div style="text-align:center;font-weight:800;margin:5px 0 12px">⚡ 0–5 s: 3 PI · 5–10 s: 2 PI · 10–15 s: 1 PI</div><div class="q" id="q"></div><div class="opts" id="opts"></div><div class="answer hidden" id="answer"></div><div class="status" id="status"></div></section>
</main>
<script>
const letters=["A","B","C","D"],icons=["🍅","🥑","🍕","🍩"];
let params=new URLSearchParams(location.search),team=parseInt(params.get("equipo")||"0"),joined=false,state=null,lastQ=-1,selected=null;
function rain(){let r=document.getElementById("rain");for(let i=0;i<18;i++){let e=document.createElement("span");e.className="b";e.textContent="🍔";e.style.left=Math.random()*100+"vw";e.style.fontSize=(22+Math.random()*16)+"px";e.style.animationDuration=(8+Math.random()*9)+"s";e.style.animationDelay=(-Math.random()*14)+"s";r.appendChild(e)}}
if(!(team>=1&&team<=4)){document.getElementById("teamPicker").classList.remove("hidden");let x=document.getElementById("teamBtns");for(let i=1;i<=4;i++)x.innerHTML+=`<button class="teamBtn" onclick="choose(${i})">${icons[i-1]} Equipo ${i}</button>`}
function choose(i){team=i;[...document.querySelectorAll(".teamBtn")].forEach((b,j)=>b.style.outline=(j+1===i)?"3px solid #d97928":"none")}
async function post(url,data){let r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw new Error(j.error||"Error");return j}
async function join(){if(!(team>=1&&team<=4)){alert("Selecciona un equipo.");return}let name=document.getElementById("name").value.trim()||("Líder "+team);try{await post("/api/join",{team,name});joined=true;document.getElementById("joinCard").classList.add("hidden");document.getElementById("game").classList.remove("hidden");poll()}catch(e){alert(e.message)}}
async function answer(i){if(!joined||!state||state.revealed)return;if(!state.deadline){document.getElementById("status").textContent="⏳ Espera a que inicie el cronómetro.";return}try{await post("/api/answer",{team,choice:i});selected=i;await poll()}catch(e){document.getElementById("status").textContent=e.message}}
async function poll(){if(!joined)return;try{state=await fetch("/api/state",{cache:"no-store"}).then(r=>r.json());render()}catch(e){}}
setInterval(poll,650);
function render(){if(!state)return;document.getElementById("who").textContent=icons[team-1]+" Equipo "+team+" · "+(state.leaders[team-1]||"Líder");if(state.phase==="final"){document.getElementById("round").textContent="Reto final";document.getElementById("q").textContent="🚀 Inventa con tu equipo un alimento del futuro y espera la puntuación del presentador.";document.getElementById("opts").innerHTML="";document.getElementById("timer").textContent="🏆";document.getElementById("status").textContent="Puntaje: "+state.scores[team-1]+" PI";return}if(lastQ!==state.question_index){lastQ=state.question_index;selected=state.submissions[team-1]}let q=state.question;document.getElementById("round").textContent=q.round;document.getElementById("q").textContent=q.q;let remain=state.deadline?Math.max(0,Math.ceil(state.deadline-Date.now()/1000)):15;document.getElementById("timer").textContent=remain||"⏰";const canAnswer=!!state.deadline&&remain>0&&!state.revealed&&selected===null;document.getElementById("opts").innerHTML=q.o.map((x,i)=>{let cls="opt";if(state.revealed){if(i===q.a)cls+=" good";else if(selected===i)cls+=" bad"}else if(selected===i)cls+=" selected";return `<button class="${cls}" ${canAnswer?"":"disabled"} onclick="answer(${i})">${letters[i]}. ${x}</button>`}).join("");let ans=document.getElementById("answer");const elapsed=state.response_times[team-1],pts=state.awarded_points[team-1]||0;if(state.revealed){ans.classList.remove("hidden");ans.textContent="Respuesta: "+q.exp;if(selected===null){document.getElementById("status").textContent="⌛ Sin respuesta · 0 PI"}else if(selected===q.a){document.getElementById("status").textContent="✅ Correcto · "+(elapsed!==null?elapsed.toFixed(1)+" s · ":"")+"+"+pts+" PI"}else{document.getElementById("status").textContent="❌ Incorrecto · 0 PI"}}else{ans.classList.add("hidden");if(!state.deadline){document.getElementById("status").textContent="⏳ Espera a que el presentador inicie los 15 segundos."}else if(selected===null){document.getElementById("status").textContent="¡Responde rápido! El tiempo cambia el puntaje."}else{document.getElementById("status").textContent="🔒 Respuesta enviada"+(elapsed!==null?" en "+elapsed.toFixed(1)+" s":"")+"."}}}
rain();
</script>
</body></html>
